<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Heidrun Code moved</title>
  <script>
    // The repository heidrun was renamed heidrun_code, and GitHub Pages does not redirect the old website address.
    (function () {
      var oldPrefix = '/heidrun/';
      var path = window.location.pathname;
      if (path === '/heidrun' || path.indexOf(oldPrefix) === 0) {
        var newPath = '/heidrun_code/' + path.slice(oldPrefix.length);
        window.location.replace(newPath + window.location.search + window.location.hash);
      }
    })();
  </script>
</head>
<body>
  <p>Page not found. The Heidrun Code website is now at <a href="https://heidrun-org.github.io/heidrun_code/">https://heidrun-org.github.io/heidrun_code/</a>.</p>
</body>
</html>
